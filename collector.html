<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScrapCall Collector</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c43">
<meta name="robots" content="noindex">
<link rel="manifest" href="collector.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Collector">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="map.css">
<style>
body{background:var(--surface2)}
.shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface2);display:flex;flex-direction:column}
.seg{display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.seg button{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:14px 8px;font-weight:700;cursor:pointer;color:var(--muted);min-height:52px}
.seg button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
@media (prefers-color-scheme: dark){.seg button[aria-selected="true"]{color:var(--hi);border-color:var(--hi)}}
.content{padding:16px;flex:1}
.job{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer}
.job:hover{border-color:var(--brand)}
.j-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.j-name{font-weight:600;font-size:17px}
.j-sub{color:var(--muted);font-size:14px}
.j-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-family:var(--head);font-size:30px;font-weight:700;line-height:1}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.cashcard{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:16px;margin-bottom:14px}
.cashcard .n{font-family:var(--head);font-size:36px;font-weight:700;line-height:1}
.cashcard .l{opacity:.85;font-size:14px;margin-top:4px}
.actions{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>*{flex:1;min-width:130px}
.sec{margin:14px 0 6px;font-weight:700;font-size:15px}
.photos a{display:inline-block;margin:0 10px 6px 0}
.wrow{display:grid;grid-template-columns:1fr 96px 74px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wrow.mine .wn{font-weight:700}
.wn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.wrow input{min-height:44px;text-align:right}
.wamt{text-align:right;font-weight:600}
.total{display:flex;justify-content:space-between;font-family:var(--head);font-size:26px;font-weight:700;padding:12px 0 4px}
.radio{display:flex;gap:10px}
.radio label{flex:1;margin:0;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-weight:600}
.radio input{position:absolute;opacity:0}
.radio input:checked + span{color:var(--brand)}
.radio label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.radio label:has(input:focus-visible){outline:3px solid var(--hi);outline-offset:2px}
.duty{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;position:relative;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;display:inline-block;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:left .15s}
.switch input:checked + .track{background:var(--ok)}
.switch input:checked + .track::after{left:23px}
.switch input:focus-visible + .track{outline:3px solid var(--hi);outline-offset:2px}
#dutyNote{font-size:14px;flex:1;min-width:200px}
@media (prefers-reduced-motion:reduce){.track::after{transition:none}}
.routecard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--brand);border-radius:14px;padding:14px;margin-bottom:12px}
.routecard>div{flex:1;min-width:200px}
.routecard .primary{min-height:46px;flex:none}
.issuebar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-bottom:2px solid var(--bad);font-size:15px}
.issuebar b{display:block}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.thumbwrap{position:relative}
.thumbwrap button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:none;background:var(--ink);color:var(--surface);cursor:pointer;font-size:15px;line-height:1}
.add-photo{width:84px;height:72px;border:1.5px dashed var(--muted);border-radius:10px;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
.rcrow{display:grid;grid-template-columns:1fr auto 84px 66px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rcrow:last-child{border-bottom:none}
.rcname small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.rcprice{font-family:var(--head);font-size:22px;font-weight:700;white-space:nowrap}
.rcprice small{font-family:var(--body);font-size:11px;font-weight:400;color:var(--muted)}
.rcrow input{min-height:42px;text-align:right}
.rcamt{text-align:right;font-weight:600}
.stepno{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:0 0 4px}
.bigchoice{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bigchoice button{min-height:64px;font-size:18px}
/* ---- picture-first look: big touch targets, one picture per thing ---- */
.ico{display:block;flex:none}
body{font-size:17px}
#lphone,#lpin{font-size:24px;min-height:60px;letter-spacing:1px}
.loginic{display:flex;justify-content:center;color:var(--brand);margin-bottom:6px}
.loginic .ico{width:72px;height:72px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:8px 4px 10px;min-height:70px}
.seg .ico{width:32px;height:32px}
.dutybtn{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;position:relative;background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:8px 12px;min-height:66px}
.dutybtn input{position:absolute;opacity:0;width:1px;height:1px}
.dutyic{width:46px;height:46px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.dutyic .ico{width:28px;height:28px}
.dutybtn input:checked ~ .dutyic{background:var(--ok);color:#fff}
.dutybtn:has(input:checked){border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.dutybtn:has(input:focus-visible){outline:3px solid var(--hi);outline-offset:2px}
.dutytx{display:flex;flex-direction:column;min-width:0}
.dutytx b{font-size:18px}
.dutytx small{font-size:12.5px;color:var(--muted)}
.problembtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:86px;min-height:66px;border-radius:16px;border:2px solid var(--bad);background:transparent;color:var(--bad);font-weight:800;cursor:pointer;font-size:13px}
.problembtn .ico{width:30px;height:30px}
.jobrow{display:flex;gap:12px;align-items:flex-start}
.jobmain{flex:1;min-width:0}
.sbadge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.sbadge .ico{width:30px;height:30px;stroke-width:2.2}
.s-todo,.s-wait{background:#b97800}.s-way{background:#1d6fd6}.s-done{background:#17795c}.s-bad{background:#b3261e}
.j-line{display:flex;gap:6px;align-items:flex-start;font-size:15px;margin-top:3px}
.j-line .ico{color:var(--muted);margin-top:2px}
.iconrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.iconrow.big .itemico{width:54px;height:54px}
.itemico{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--brand);flex:none;font-weight:800;font-size:14px}
.itemico .ico{width:26px;height:26px}
.iconrow.big .itemico .ico{width:34px;height:34px}
.itemico.bad{color:var(--bad);border-color:var(--bad)}
@media (prefers-color-scheme: dark){.itemico{color:var(--hi)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:10px 0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:94px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;text-align:center;cursor:pointer;text-decoration:none;font-family:inherit}
.tile .ico{width:40px;height:40px;color:var(--brand)}
@media (prefers-color-scheme: dark){.tile .ico{color:var(--hi)}}
.tile.call .ico{color:var(--ok)}
.tile[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--brand)}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.yesno button{min-height:112px;border-radius:18px;border:none;color:#fff;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:inherit}
.yesno button small{font-size:13px;font-weight:600;opacity:.92}
.yesno .ico{width:48px;height:48px;stroke-width:2.4}
.btn-yes{background:#17795c}.btn-no{background:#b3261e}
.fb{display:flex;gap:8px;align-items:center;justify-content:center;min-height:64px;border-radius:14px;font-weight:800;font-size:18px;border:2px solid transparent;cursor:pointer;font-family:inherit;padding:0 14px}
.fb .ico{width:28px;height:28px}
.fb.back{background:var(--surface);border-color:var(--line);color:var(--ink)}
.fb.go{background:var(--brand);color:var(--brand-ink)}
.fb.yes{background:#17795c;color:#fff}.fb.no{background:#b3261e;color:#fff}.fb.way{background:#1d6fd6;color:#fff}
.fb[disabled]{opacity:.4;cursor:not-allowed}
.stepbar{display:flex;align-items:center;margin:2px 0 10px}
.sb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:2px solid var(--line);color:var(--muted);flex:none}
.sb.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sb.done{background:var(--ok);border-color:var(--ok);color:#fff}
.sbline{flex:1;height:4px;background:var(--line);border-radius:2px}
.sbline.done{background:var(--ok)}
.cf-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cf-row .itemico{width:46px;height:46px}
.cf-main{flex:1;min-width:0}
.cf-main b{display:block}
.cf-main .ico{display:inline-block;vertical-align:-2px;color:var(--muted)}
.cf-amt{font-family:var(--head);font-size:26px;font-weight:700}
.cf-line{text-align:center;color:var(--muted);margin:2px 0 6px}
.bignum{font-family:var(--head);font-size:60px;font-weight:700;line-height:1;text-align:center;margin:10px 0 2px}
.cf-warn{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--bad) 14%,var(--surface));border:2px solid var(--bad);border-radius:12px;padding:10px;font-weight:700;margin:10px 0}
.cf-warn .ico{color:var(--bad);width:30px;height:30px}
.nophoto{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px;border:2px dashed var(--line);border-radius:12px;font-weight:700;cursor:pointer}
.nophoto input{width:24px;height:24px;accent-color:var(--brand);flex:none}
.photobtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface));color:var(--brand);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.photobtn.big{width:136px;height:108px}.photobtn.big .ico{width:46px;height:46px}
.photobtn.small{width:96px;height:108px;border-color:var(--line);background:var(--surface);color:var(--muted)}.photobtn.small .ico{width:32px;height:32px}
@media (prefers-color-scheme: dark){.photobtn{color:var(--hi);border-color:var(--hi)}}
.thumb{width:84px;height:84px}
.wrow{display:grid;grid-template-columns:48px 1fr auto;grid-template-areas:"ico name name" "ctl ctl amt";gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow .itemico{grid-area:ico}
.wrow .wn{grid-area:name;min-width:0}
.wrow .wctl{grid-area:ctl}
.wrow .wamt{grid-area:amt;font-size:20px;min-width:72px}
.wrow .itemico{width:48px;height:48px}
.wn small{display:flex;gap:4px;align-items:center}
.wn small .ico{width:14px;height:14px}
.wctl{display:flex;gap:6px;align-items:center}
.wrow input{width:116px;min-height:56px;font-size:24px;font-weight:800;text-align:center}
.stepper{width:46px;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.stepper .ico{width:24px;height:24px;stroke-width:2.4}
.secic{display:flex;gap:8px;align-items:center;font-size:17px}
.paytile{flex:1;margin:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:center;cursor:pointer;min-height:100px;display:flex;align-items:center;justify-content:center}
.paytile span{display:flex;flex-direction:column;align-items:center;gap:6px}
.paytile .ico{width:44px;height:44px;color:var(--brand)}
.radio label.paytile:has(input:checked){border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));box-shadow:inset 0 0 0 2px var(--ok)}
.rcrow{grid-template-columns:48px 1fr auto;row-gap:6px}
.rcrow .itemico{width:48px;height:48px}
.rcinput{grid-column:2 / 4;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.rcinput input{width:110px}
.rcprice small{display:inline-flex;gap:3px;align-items:center}
.rcprice small .ico{width:12px;height:12px}
.cashcard .ico{float:right;width:38px;height:38px;opacity:.9}
.stat .ico{width:28px;height:28px;color:var(--brand);margin-bottom:4px}
@media (prefers-color-scheme: dark){.stat .ico{color:var(--hi)}}
.issuein{display:flex;gap:10px;align-items:flex-start}
.issuein .ico{color:var(--bad);width:32px;height:32px}
.center{text-align:center}
/* in-app camera: the photo is taken inside the app, so Android never closes it to open the camera app */
.camov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.camov video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cambar{display:flex;align-items:center;justify-content:space-around;gap:16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.cambar .fb{min-width:120px}
.shutter{width:88px;height:88px;border-radius:50%;border:6px solid #fff;background:#17795c;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.shutter .ico{width:40px;height:40px}
.camwait{position:absolute;top:40%;left:0;right:0;text-align:center;color:#fff;font-weight:700}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="card">
    <div class="loginic" data-ic="truck" data-sz="72"></div>
    <div class="logo">ScrapCall</div>
    <p class="lede">Collector sign-in</p>
    <div class="field">
      <label for="lphone">Phone number</label>
      <input type="tel" id="lphone" inputmode="tel" autocomplete="tel">
    </div>
    <div class="field">
      <label for="lpin">PIN</label>
      <input type="password" id="lpin" inputmode="numeric" autocomplete="current-password" maxlength="6">
      <div class="err" id="loginErr" role="alert"></div>
    </div>
    <button class="fb go block" id="loginBtn" type="button" style="width:100%"><span data-ic="next" data-sz="28"></span><span>Sign in</span></button>
  </div>
</div>

<div class="shell" id="app" hidden>
  <header class="top">
    <div class="logo">ScrapCall<small id="hello">Collector</small></div>
    <div class="top-actions">
      <button class="chip-btn" id="installBtn" type="button" hidden>Install app</button>
      <button class="chip-btn" id="signOut" type="button">Sign out</button>
    </div>
  </header>
  <div class="conn" id="conn" role="status" aria-live="polite"><span class="dot"></span><span id="connText">Online</span><span id="qInfo" class="pill warn" style="margin-left:auto" hidden></span></div>
  <div class="duty" id="duty">
    <label class="dutybtn"><input type="checkbox" id="dutySw"><span class="dutyic" data-ic="power" data-sz="28"></span><span class="dutytx"><b>On duty</b><small id="dutyNote">Off duty. Your location isn’t shared.</small></span></label>
    <button class="problembtn" id="issueBtn" type="button"><span data-ic="warning" data-sz="30"></span><span>Problem</span></button>
  </div>
  <div class="issuebar" id="issueBar" role="status" hidden></div>
  <div class="seg" role="tablist">
    <button role="tab" id="tabJobs" aria-selected="true"><span data-ic="list" data-sz="32"></span><span>Jobs</span></button>
    <button role="tab" id="tabToday" aria-selected="false"><span data-ic="today" data-sz="32"></span><span>Today</span></button>
    <button role="tab" id="tabMap" aria-selected="false"><span data-ic="map" data-sz="32"></span><span>Map</span></button>
    <button role="tab" id="tabRates" aria-selected="false"><span data-ic="tag" data-sz="32"></span><span>Rates</span></button>
  </div>
  <div class="content">
    <section id="v-jobs" aria-label="My jobs"></section>
    <section id="v-today" aria-label="Today" hidden></section>
    <section id="v-rates" aria-label="Rate card" hidden></section>
    <section id="v-map" aria-label="Map" hidden>
      <div class="btnrow" style="margin-bottom:8px"><button class="fb back" id="meBtn" type="button"><span data-ic="pin" data-sz="28"></span><span>Show my location</span></button></div>
      <div id="jobMap" class="map-box tall"></div>
      <p class="map-note" id="mapNote"></p>
    </section>
  </div>
</div>

<dialog id="dlg" aria-modal="true"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="leaflet.js"></script>
<script src="map.js"></script>
<script src="route.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="common.js"></script>
<script>
(function(){
  var $=SC.$, $$=SC.$$, esc=SC.esc;
  var TK="scrapcall_collector_token", QK="scrapcall_collector_queue", DK="scrapcall_collector_data";
  var token=SC.load(TK,null);
  var S=SC.load(DK,{jobs:[],cash:{balance:0},rates:[],name:"",today:""});
  var queue=SC.load(QK,[]), tab="jobs", syncing=false, timer=null;

  /* ---------- pictures ---------- */
  function ic(n,sz){ return window.SCIcons?SCIcons.svg(n,sz||24):""; }
  function rateOf(name){ return (S.rates||[]).filter(function(x){return x.name===name;})[0]; }
  function itemIcon(name,sz){ var r=rateOf(name); return window.SCIcons?SCIcons.item(name,r&&r.icon,sz||28):""; }
  function itemIcons(types){
    var names=String(types||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
    return names.slice(0,6).map(function(n){ return '<span class="itemico" title="'+esc(n)+'">'+itemIcon(n,26)+'</span>'; }).join("")+
      (names.length>6?'<span class="itemico">+'+(names.length-6)+'</span>':"");
  }
  function hydrate(root){ $$("[data-ic]",root).forEach(function(el){ el.innerHTML=ic(el.dataset.ic,+el.dataset.sz||24); }); }
  function buzz(ok){ try{ if(navigator.vibrate) navigator.vibrate(ok?35:[60,40,60]); }catch(e){} }
  // a row of big picture buttons for choosing one reason; a hidden <select> keeps the chosen value
  function tileHtml(list,id){
    return '<div class="tiles" id="'+id+'" role="group">'+list.map(function(r,i){
      return '<button type="button" class="tile" data-v="'+r[0]+'" aria-pressed="'+(i===0)+'">'+ic(r[2],40)+'<span>'+esc(r[1])+'</span></button>';
    }).join("")+'</div>';
  }
  function bindTiles(id,selId){
    var box=$("#"+id), sel=$("#"+selId);

  /* ---------- offline queue: updates are saved here until they reach the office ---------- */
  function uid(){ return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function pendingCash(){
    return queue.reduce(function(s,a){ return s+(a.type==="complete"&&a.method==="Cash"?a.est.amt:0); },0);
  }
  function applyQueue(){
    queue.forEach(function(a){
      if(a.type==="issue"){ S.unavailable={reason:a.label,pending:true}; return; }
      var j=S.jobs.filter(function(x){return x.code===a.code;})[0]; if(!j) return;
      if(a.type==="photos"){ // counted once per queued action, even if applyQueue runs again
        j._ph=j._ph||{};
        if(!j._ph[a.id]){ j._ph[a.id]=1; j.donePhotoCount=(j.donePhotoCount||0)+a.photos.length; }
        j.photosPending=true; return;
      }
      if(a.type==="nocollect"){ j.status="Not collected"; j.pending=true; return; }
      if(a.type==="status"&&j.status==="Assigned") j.status="On the way";
      if(a.type==="complete"&&j.status!=="Completed"){ j.status="Completed"; j.kg=a.est.kg; j.pieces=a.est.pcs||0; j.paid=a.est.amt; j.method=a.method; j.pending=true; j.details=a.est.lines; j.donePhotoCount=(a.photos||[]).length; }
      else if(a.type==="complete") j.pending=true;
    });
  }
  function enqueue(a){
    queue.push(a);
    if(!SC.save(QK,queue)){
      // the phone's storage is full: keep the update, drop the photos
      if(a.photos&&a.photos.length){
        if(a.type==="photos"){ queue.pop(); SC.toast("There isn’t enough space on this phone to keep those photos until you have signal. Try again when you are online."); return false; }
        a.photos=[]; a.photosDropped=true;
      }
      if(!SC.save(QK,queue)){ queue.pop(); SC.toast("There isn’t enough space on this phone to save that."); return false; }
      if(a.photosDropped) SC.toast("The photos were too big to keep without signal, so the update was saved without them.");
    }
    applyQueue(); SC.save(DK,S); render(); processQueue().then(refresh);
    return a.photosDropped?"dropped":true;   // "dropped" = saved, but without its photos (the warning is already on screen)
  }
  function processQueue(){
    if(syncing||!queue.length||navigator.onLine===false||!token) return Promise.resolve();
    syncing=true;
    function next(){
      if(!queue.length){ syncing=false; return Promise.resolve(); }
      var a=queue[0];
      var req=a.type==="nocollect"?call("c_nocollect",{code:a.code,reason:a.reason,note:a.note,photos:a.photos||[]}):a.type==="issue"?call("c_issue",{reason:a.reason,note:a.note}):a.type==="photos"?call("c_photos",{id:a.id,code:a.code,photos:a.photos}):a.type==="status"?call("c_status",{code:a.code,status:a.status}):call("c_complete",{code:a.code,items:a.items,method:a.method,note:a.note,photos:a.photos||[]});
      return req.then(function(res){
        if(!(res&&res.ok)) SC.toast((a.code||"Problem report")+": "+((res&&res.error)||"couldn’t be saved"));
        queue.shift(); SC.save(QK,queue); return next();
      }).catch(function(){ syncing=false; render(); });   // no connection or signed out: keep the queue
    }
    return next().then(function(){ syncing=false; render(); });
  }

  /* ---------- route plan: the best order for your stops ---------- */
  var plan=null, planAt=0, manualPos=null;
  function startPoint(){
    var p=(typeof lastPos!=="undefined"&&lastPos)||manualPos;
    return p?[Math.round(p.lat*1000)/1000,Math.round(p.lng*1000)/1000]:null;   // ~100 m, so the same road table is reused
  }
  function jobsKey(jobs){ return jobs.map(function(j){ return j.code+"|"+j.status+"|"+(j.confirmedInput||"")+"|"+j.lat+","+j.lng; }).join(";"); }
  function refreshPlan(force){
    if(!window.SCRoute||!window.SCMap) return;
    var jobs=openJobs().filter(validPin), key=jobsKey(jobs);
    if(!force&&plan&&plan.jobsKey===key&&Date.now()-planAt<120000) return;
    planAt=Date.now();
    var st=startPoint();
    var stops=jobs.map(function(j){ return {id:j.code,lat:j.lat,lng:j.lng,time:j.confirmedInput||""}; });
    function done(fn){
      var p=SCRoute.plan(st,stops,fn); p.jobsKey=key; p.live=!!(fn&&fn.live); p.start=st; plan=p; planAt=Date.now(); render();
    }
    if(!stops.length){ plan={order:[],legs:[],km:0,min:0,jobsKey:key,live:false,start:st}; render(); return; }
    var pts=(st?[st]:[]).concat(stops.map(function(x){ return [x.lat,x.lng]; }));
    if(navigator.onLine===false||pts.length<2) done(SCRoute.estimate);
    else SCRoute.matrix(pts).then(done);
  }
  function orderedJobs(){
    var jobs=openJobs();
    if(!plan||plan.jobsKey!==jobsKey(jobs.filter(validPin))) return jobs;
    var by={}; jobs.forEach(function(j){ by[j.code]=j; });
    var out=plan.order.map(function(x){ return by[x.id]; }).filter(Boolean);
    jobs.forEach(function(j){ if(out.indexOf(j)<0) out.push(j); });
    return out;
  }
  function legLine(j,n){
    if(!n||!plan||!window.SCRoute) return "";
    var l=plan.legs.filter(function(x){ return x.id===j.code; })[0];
    if(!l||l.first) return "";
    return '<div class="j-sub"><b>'+esc(SCRoute.fmt(l.km,l.min,l.road))+'</b> '+(n===1&&plan.start?"from where you are":"from the previous stop")+'</div>';
  }
  function routeCard(){
    if(!plan||!plan.order.length||!window.SCRoute) return "";
    var stops=plan.order.map(function(x){ return {lat:x.lat,lng:x.lng}; });
    return '<div class="routecard"><div><b>Your route: '+plan.order.length+' stop'+(plan.order.length===1?"":"s")+' · '+esc(SCRoute.fmt(plan.km,plan.min,plan.live))+'</b>'+
      '<div class="hint">Stops are in the order that saves driving. Pickups with an agreed time stay in time order. '+(plan.live?"Road distances, no live traffic.":"Estimated until you are online.")+'</div></div>'+
      '<a class="primary" href="'+esc(SCRoute.navLink(stops))+'" target="_blank" rel="noopener">Navigate all stops</a></div>';
  }

      (done.length?'<h2>Done today</h2>'+done.map(function(j){ return jobCard(j); }).join(""):'<div class="empty"><b>Nothing completed yet today</b>Finished pickups appear here.</div>')+

  /* ---------- camera: photos are shrunk on the phone so they save and send quickly ---------- */
  // Big camera photos (50 MP and more) can run a phone out of memory if read in full, so the photo is decoded
  // straight to a smaller size where the phone allows it, and never copied into memory as text first
  function shrink(file){
    function paint(src,w,h){
      var k=Math.min(1,960/Math.max(w,h)), c=document.createElement("canvas");
      c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext("2d").drawImage(src,0,0,c.width,c.height);
      return c.toDataURL("image/jpeg",.65);
    }
    return new Promise(function(res){
      function viaImage(){
        var url=URL.createObjectURL(file), img=new Image();
        img.onload=function(){ var d=null; try{ d=paint(img,img.naturalWidth,img.naturalHeight); }catch(e){} URL.revokeObjectURL(url); res(d); };
        img.onerror=function(){ URL.revokeObjectURL(url); res(null); };
        img.src=url;
      }
      if(!window.createImageBitmap) return viaImage();
      createImageBitmap(file,{resizeWidth:960,resizeQuality:"medium"}).then(function(bm){
        var d=null; try{ d=paint(bm,bm.width,bm.height); }catch(e){} if(bm.close) bm.close();
        if(d) res(d); else viaImage();
      }).catch(viaImage);
    });
  }
  // The camera inside the app. Opening the phone's camera app makes Android close this app on many phones,
  // and the photo is lost; here the photo is taken from a live camera view instead. Returns false if the
  // phone can't do this (then the phone's camera app is used).
  function openCamera(onShot){
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return false;
    var host=$("#dlg").open?$("#dlg"):document.body, stream=null;
    var ov=document.createElement("div"); ov.className="camov";
    ov.innerHTML='<video playsinline autoplay muted></video><p class="camwait">Opening the camera…</p>'+
      '<div class="cambar"><button type="button" class="fb back" data-x>'+ic("cross",28)+'<span>Cancel</span></button>'+
      '<button type="button" class="shutter" data-shot aria-label="Take the photo">'+ic("camera",40)+'</button></div>';
    host.appendChild(ov);
    var v=$("video",ov);
    function stop(){ if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; if(ov.parentNode) ov.parentNode.removeChild(ov); }
    $("[data-x]",ov).addEventListener("click",function(){ buzz(false); stop(); });
    navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}})
      .then(function(s){ stream=s; v.srcObject=s; var p=v.play(); if(p&&p.catch) p.catch(function(){}); $(".camwait",ov).hidden=true; })
      .catch(function(){ stop(); SC.toast("The camera isn’t allowed for this app. Allow it in the browser’s site settings, or use Gallery."); });
    $("[data-shot]",ov).addEventListener("click",function(){
      if(!v.videoWidth) return;
      var k=Math.min(1,960/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement("canvas");
      c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k);
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      var d=c.toDataURL("image/jpeg",.7);
      buzz(true); stop(); onShot(d);
    });
    return true;
  }
  // Fills `box` with the photos in `arr` and "Take photo" / "From gallery" buttons (up to `max` photos)
  function mountPhotos(box,arr,max,onChange){
    function draw(){
      box.innerHTML=arr.map(function(p,i){ return '<div class="thumbwrap"><img class="thumb" alt="Photo '+(i+1)+'" src="'+p+'"><button type="button" aria-label="Remove photo '+(i+1)+'" data-rm="'+i+'">×</button></div>'; }).join("")+
        (arr.length<max?'<button type="button" class="photobtn big" data-cam>'+ic("camera",46)+'<span>Take photo</span></button><button type="button" class="photobtn small" data-gal>'+ic("gallery",32)+'<span>Gallery</span></button>':"")+
        '<input type="file" accept="image/*" capture="environment" hidden data-fc><input type="file" accept="image/*" multiple hidden data-fg>';
      $$("[data-rm]",box).forEach(function(b){ b.addEventListener("click",function(){ arr.splice(+b.dataset.rm,1); draw(); onChange(); }); });
      var fc=$("[data-fc]",box), fg=$("[data-fg]",box), cam=$("[data-cam]",box), gal=$("[data-gal]",box);
      if(cam) cam.addEventListener("click",function(){
        var ok=openCamera(function(d){ if(arr.length<max) arr.push(d); draw(); onChange(); });
        if(!ok) fc.click();   // no camera view possible on this phone: use the phone's camera app
      });
      if(gal) gal.addEventListener("click",function(){ fg.click(); });
      [fc,fg].forEach(function(inp){ inp.addEventListener("change",function(){
        var files=Array.prototype.slice.call(inp.files||[]).slice(0,max-arr.length);
        Promise.all(files.map(shrink)).then(function(list){
          var bad=0; list.forEach(function(d){ if(!d) bad++; else if(arr.length<max) arr.push(d); });
          draw(); onChange();
          if(bad) SC.toast("That photo couldn’t be used. Take it again, or choose it from the Gallery.");
        });
      }); });
    }
    draw();
  }

        '<input type="number" inputmode="'+(r.unit==="piece"?"numeric":"decimal")+'" min="0" step="'+(r.unit==="piece"?"1":"0.01")+'" placeholder="'+(r.unit==="piece"?"qty":"kg")+'" aria-label="'+(r.unit==="piece"?"number of ":"kg of ")+esc(r.name)+'" data-rc="'+i+'"><div class="rcamt" data-rcamt="'+i+'">0.00</div></div></div>';
    }).join("")+'</div><div class="total"><span>Quote total</span><span><span id="rcKg">0</span> kg · <span id="rcPcs">0</span> pcs · <span id="rcAmt">0.00</span></span></div>'+
      '<div class="btnrow"><button class="secondary" id="rcClear" type="button">Clear</button></div>'+
      '<p class="hint">A quick calculator for quoting at the door. The price that counts is saved when you complete the pickup.</p>';
    $("#rcNote").textContent=navigator.onLine===false?"Saved on this phone"+(when?" on "+when:"")+". Prices may have changed since.":"Price per kg, set by the office"+(when?". Updated "+when:"")+".";
    function calcRc(){
      var kg=0,pcs=0,amt=0;
      $$("#v-rates input[data-rc]").forEach(function(i){
        var r=S.rates[+i.dataset.rc], piece=r.unit==="piece", k=piece?Math.floor(Number(i.value)||0):SC.num(i.value), a=SC.num(k*r.rate);
        $('[data-rcamt="'+i.dataset.rc+'"]').textContent=SC.money(a); amt=SC.num(amt+a);

  }

  /* ---------- tell the office about a problem (vehicle broke down, unwell, ...) ---------- */

  /* ---------- on duty: share your location with the office ---------- */
  var DUTY_K="scrapcall_collector_duty", CONSENT_K="scrapcall_collector_consent", OFF_K="scrapcall_collector_pending_off";
  var watchId=null, lastPos=null, lastSent=null, sendTimer=null, wake=null, dutyOn=false;
  function dutyNote(t){ $("#dutyNote").textContent=t; }
  function kmBetween(a,b){
    var R=6371,rad=Math.PI/180,dLa=(b.lat-a.lat)*rad,dLn=(b.lng-a.lng)*rad;
    var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLn/2)*Math.sin(dLn/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
  }
  function requestWake(){
    if(!dutyOn||!navigator.wakeLock||wake) return;
    navigator.wakeLock.request("screen").then(function(l){ wake=l; l.addEventListener("release",function(){ wake=null; }); }).catch(function(){});
  }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&dutyOn) requestWake(); });
  function sendPos(force){
    if(!dutyOn||!lastPos||!token||navigator.onLine===false) return Promise.resolve();
    return call("c_ping",{lat:lastPos.lat,lng:lastPos.lng,acc:lastPos.acc,duty:true}).then(function(res){
      if(res&&res.ok){ lastSent={lat:lastPos.lat,lng:lastPos.lng,at:Date.now()}; dutyNote("On duty. The office can see where you are."); }
    }).catch(function(){});
  }
  function onPos(p){
    var acc=Math.round(p.coords.accuracy||0);
    if(acc>1500) { dutyNote("On duty, but your location is not accurate yet. Move to an open area."); return; }
    lastPos={lat:Math.round(p.coords.latitude*1e6)/1e6,lng:Math.round(p.coords.longitude*1e6)/1e6,acc:acc,at:Date.now()};
    if(cmap&&window.SCMap&&tab==="map"){
      if(mePin) mePin.setLatLng([lastPos.lat,lastPos.lng]); else { mePin=L.marker([lastPos.lat,lastPos.lng],{icon:SCMap.pinIcon("","p-me")}); mePin.addTo(cmap); }
    }
    if(plan&&!plan.start) refreshPlan(true);
    // send the first fix, then when you have moved 100 m (at most every 30 s); the timer sends every 2 minutes anyway
    if(!lastSent||(Date.now()-lastSent.at>30000&&kmBetween(lastSent,lastPos)>0.1)) sendPos();
  }
  function onPosErr(e){
    if(e&&e.code===1){ stopDuty(); SC.toast("Location is blocked for this app. Allow location in your browser settings, then switch On duty again."); }
    else dutyNote("On duty, but your location can’t be found yet. Move to an open area.");
  }
  function startDuty(){
    if(!navigator.geolocation){ $("#dutySw").checked=false; SC.toast("This phone can’t share its location."); return; }
    if(!SC.load(CONSENT_K,false)){
      if(!confirm("While you are On duty, the app shares your location with the office so they can send you pickups near you.\n\nSharing stops when you switch off duty or sign out. Keep the app open on screen: it can’t share your location when it is closed or the phone is locked.\n\nSwitch on duty?")){ $("#dutySw").checked=false; return; }
      SC.save(CONSENT_K,true);
    }
    dutyOn=true; SC.save(DUTY_K,true); SC.drop(OFF_K); lastSent=null;
    dutyNote("On duty. Finding your location…");
    watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:30000,timeout:30000});
    clearInterval(sendTimer); sendTimer=setInterval(function(){ sendPos(); },120000);
    requestWake();
  }
  function pingOff(){
    if(!token) return;
    if(navigator.onLine===false){ SC.save(OFF_K,true); return; }
    call("c_ping",{duty:false}).then(function(res){ if(res&&res.ok) SC.drop(OFF_K); else SC.save(OFF_K,true); }).catch(function(){ SC.save(OFF_K,true); });
  }
  function stopDuty(){
    var was=dutyOn; dutyOn=false; SC.save(DUTY_K,false); $("#dutySw").checked=false;
    if(watchId!==null&&navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    watchId=null; clearInterval(sendTimer); lastPos=null; lastSent=null;
    if(wake){ try{wake.release();}catch(e){} wake=null; }
    dutyNote("Off duty. Your location isn’t shared.");
    if(was||SC.load(OFF_K,false)) pingOff();
  }
  $("#dutySw").addEventListener("change",function(){ if(this.checked) startDuty(); else stopDuty(); });
  window.addEventListener("online",function(){
    if(dutyOn) sendPos(); else if(SC.load(OFF_K,false)) pingOff();
  });
  function resumeDuty(){ if(SC.load(DUTY_K,false)){ $("#dutySw").checked=true; startDuty(); } }

  /* ---------- map of today's stops ---------- */
  var cmap=null, clayer=null, mePin=null, jmap=null;
  function renderMap(refit){
    var box=$("#jobMap"), jobs=orderedJobs();
    var nopin=jobs.filter(function(j){ return !validPin(j); }).length;
    $("#mapNote").textContent=!jobs.length?"No open jobs to show.":"Numbers show the best order for your stops. The blue line is the road route. Tap a pin for directions."+(nopin?" "+nopin+" job"+(nopin===1?" has":"s have")+" no pin: open the job to get directions from the address.":"");
    $("#meBtn").hidden=!mapOk();
    if(!mapOk()){
      if(cmap){ try{cmap.remove();}catch(e){} cmap=null; mePin=null; }
      if(window.SCMap) SCMap.offNote(box,"The map needs an internet connection. Your job list still works, and each job has a Directions button.");
      return;
    }
    if(!cmap){ cmap=SCMap.create(box,{}); clayer=L.layerGroup().addTo(cmap); refit=true; }
    cmap.invalidateSize(); clayer.clearLayers();
    var pts=[];
    jobs.forEach(function(j,i){
      if(!validPin(j)) return;
      var m=L.marker([j.lat,j.lng],{icon:SCMap.pinIcon(String(i+1),j.status==="On the way"?"p-way":"p-assigned")}).addTo(clayer);
      m.bindPopup('<b>'+(i+1)+'. '+esc(j.name)+'</b><br>'+esc(j.addr.slice(0,80))+'<br><a href="'+esc(dirHref(j))+'" target="_blank" rel="noopener">Directions</a><br><button data-open>Open job</button>');
      m.on("popupopen",function(e){ var b=e.popup.getElement().querySelector("[data-open]"); if(b) b.onclick=function(){ openJob(j.code); }; });
      pts.push([j.lat,j.lng]);
    });
    if(mePin) mePin.addTo(cmap);
    if(refit&&pts.length) cmap.fitBounds(pts,{padding:[40,40],maxZoom:16});
    drawRoute();
  }
  var rtoken=0;
  function drawRoute(){
    if(!window.SCRoute||!plan||!plan.order.length||!cmap) return;
    var tk=++rtoken, pts=(plan.start?[plan.start]:[]).concat(plan.order.map(function(x){ return [x.lat,x.lng]; }));
    SCRoute.route(pts).then(function(res){
      if(tk!==rtoken||!cmap) return;
      L.polyline(res.coords,{color:"#1d6fd6",weight:5,opacity:.75,dashArray:res.road?null:"6 8"})
        .bindTooltip(SCRoute.fmt(res.km,res.min,res.road)).addTo(clayer);
    });
  }
  $("#meBtn").addEventListener("click",function(){
    if(!cmap||!window.SCMap) return;
    SCMap.locate().then(function(p){
      manualPos={lat:p.lat,lng:p.lng}; refreshPlan(true);
      if(mePin) mePin.setLatLng([p.lat,p.lng]); else mePin=L.marker([p.lat,p.lng],{icon:SCMap.pinIcon("","p-me")});
      mePin.addTo(cmap);
      var pts=openJobs().filter(validPin).map(function(j){ return [j.lat,j.lng]; }); pts.push([p.lat,p.lng]);
      cmap.fitBounds(pts,{padding:[40,40],maxZoom:16});
    }).catch(function(){ SC.toast("Couldn’t get your location. Allow location access in your browser settings."); });
  });
  $("#dlg").addEventListener("close",function(){ if(jmap){ try{jmap.remove();}catch(e){} jmap=null; } });

  /* ---------- one job ---------- */
  function findJob(code){ return S.jobs.filter(function(j){return j.code===code;})[0]; }
  function openJob(code){
    var j=findJob(code); if(!j) return;
    var wa=SC.waHref(j.phone);
    var photos=(j.photos||[]).map(function(u,i){ var l=SC.safeLink(u); return l?'<a href="'+esc(l)+'" target="_blank" rel="noopener">Photo '+(i+1)+'</a>':""; }).join("");
    var tiles='<div class="tiles">'+
      '<a class="tile call" href="'+esc(SC.telHref(j.phone))+'">'+ic("phone",40)+'<span>Call</span></a>'+
      (wa?'<a class="tile" href="'+esc(wa)+'" target="_blank" rel="noopener">'+ic("chat",40)+'<span>WhatsApp</span></a>':"")+
      (j.alt?'<a class="tile call" href="'+esc(SC.telHref(j.alt))+'">'+ic("phone",40)+'<span>Call other number</span></a>':"")+
      '<a class="tile" href="'+esc(dirHref(j))+'" target="_blank" rel="noopener">'+ic("navigate",40)+'<span>Directions</span></a>'+
      '<a class="tile" href="'+esc(viewHref(j))+'" target="_blank" rel="noopener">'+ic("map",40)+'<span>View on map</span></a></div>';
    var body=
      '<p class="j-name">'+esc(j.name)+'</p>'+tiles+
      '<div class="j-line">'+ic("pin",20)+'<span><b>Address:</b> '+esc(j.addr)+'</span></div>'+
      (validPin(j)&&mapOk()?'<div id="jMap" class="map-box small"></div>':"")+
      '<div class="j-line">'+ic("clock",20)+'<span><b>When:</b> '+esc(j.confirmed?j.confirmed:SC.day(j.day)+", "+(j.slot||"").toLowerCase()+" (not confirmed)")+'</span></div>'+
      '<div class="iconrow big">'+itemIcons(j.types)+'</div>'+
      '<p class="detail"><b>Scrap:</b> '+esc(j.types)+' — '+esc(j.qty)+'</p>'+
      (j.notes?'<p class="detail"><b>Customer notes:</b> '+esc(j.notes)+'</p>':"")+
      (photos?'<div class="photos detail">'+photos+'</div>':"")+
      (j.phoneOk?"":'<p class="detail"><b>The office hasn’t confirmed this customer’s phone number yet.</b></p>')+
      (j.status==="Completed"?'<div class="sec">Collected</div><p class="detail"><b>'+SC.qty(j.kg,j.pieces)+'</b> · '+SC.money(j.paid)+' ('+esc(j.method)+')'+(j.pending?" · waiting to send":"")+'</p><p class="detail" style="white-space:pre-line">'+esc(j.details)+'</p>':"")+
      (j.status==="Not collected"?'<div class="sec">Not collected</div><p class="detail">The office has been told and will decide what happens next.</p>':"")+
      (j.status==="Completed"?'<div class="sec secic">'+ic("camera",22)+' Photos</div><p class="detail">'+(j.donePhotoCount?j.donePhotoCount+" saved"+(j.photosPending||j.pending?" (some waiting to send)":""):"No photos yet")+'. You can add a photo of the scrap, the receipt or the handover.</p><div class="photos" id="aPhotos"></div>':"");
    var foot="";
    if(j.status==="Completed"&&(j.donePhotoCount||0)<8) foot+='<button class="fb go" id="aSave" type="button" disabled>'+ic("upload",28)+'<span>Save photos</span></button>';
    if(j.status==="Assigned") foot+='<button class="fb way" id="jWay" type="button">'+ic("truck",30)+'<span>I’m on the way</span></button>';
    if(j.status==="Assigned"||j.status==="On the way") foot+='<button class="fb yes" id="jDone" type="button">'+ic("paper",30)+'<span>Collect the scrap</span></button>';
    SC.dialog(j.code,body,foot||null);
    if(validPin(j)&&mapOk()){
      jmap=SCMap.create($("#jMap"),{center:{lat:j.lat,lng:j.lng,zoom:16}});

      // on a touchscreen a swipe over the map should scroll the pop-up, not move the map (Directions opens the full map)
      if(L.Browser.touch&&jmap){ jmap.dragging.disable(); if(jmap.tap) jmap.tap.disable(); }
      setTimeout(function(){ if(jmap) jmap.invalidateSize(); },150);
    }
    if(j.status==="Completed"&&$("#aPhotos")){
      var apics=[], room=Math.max(0,Math.min(4,8-(j.donePhotoCount||0)));
      if(room>0) mountPhotos($("#aPhotos"),apics,room,function(){ var b=$("#aSave"); if(b) b.disabled=!apics.length; });
      else $("#aPhotos").innerHTML='<span class="hint">This pickup already has 8 photos.</span>';
      var ab=$("#aSave"); if(ab) ab.addEventListener("click",function(){
        if(!apics.length) return;
        var sent2=enqueue({id:uid(),type:"photos",code:j.code,photos:apics.slice()});
        if(sent2===false) return;
        SC.closeDialog(); if(sent2!=="dropped") SC.toast(navigator.onLine===false?"Saved on this phone. It will be sent when you’re online.":"Photos saved.");
      });
    }
    var w=$("#jWay"); if(w) w.addEventListener("click",function(){
      enqueue({id:uid(),type:"status",code:j.code,status:"On the way"}); buzz(true); SC.closeDialog();
      SC.toast(navigator.onLine===false?"Saved. It will be sent when you’re online.":"Marked as on the way.");
    });
    var d=$("#jDone"); if(d) d.addEventListener("click",function(){ completeForm(j); });
  }

  /* ---------- at the pickup: 1) is the scrap there?  2) photo  3) weigh and pay ---------- */
  var NOCOL=[["absent","Customer not there","absent"],["nothing","No scrap at the address","empty"],["address","Wrong or unreachable address","wrongplace"],["refused","Customer cancelled or refused","refused"],["other","Other reason","other"]];
  function stepBar(n){
    var names=["eye","camera","scale"], out='<div class="stepbar" aria-hidden="true">';
    names.forEach(function(name,i){
      var k=i+1, cls=k<n?"done":k===n?"on":"";
      out+='<span class="sb '+cls+'">'+ic(k<n?"check":name,26)+'</span>'+(k<3?'<span class="sbline '+(k<n?"done":"")+'"></span>':"");
    });
    return out+'</div>';
  }
  function completeForm(j){
    if(!S.rates.length){ SC.toast("The price list isn’t saved on this phone yet. Connect to the internet once."); return; }
    stepScrap(j,{pics:[],npics:[],noPhoto:false,vals:{},method:"Cash",note:""});
  }
  // The pickup in progress is kept on the phone at every step. Phones often close the browser page while the
  // camera is open; when the app opens again the collector carries on where they were, photos included.
  var PK="scrapcall_collector_pickup", keptAt="";
  function keepPickup(j,st,step){
    keptAt=step;
    var p={code:j.code,step:step,pics:st.pics,npics:st.npics||[],noPhoto:st.noPhoto,vals:st.vals,method:st.method,note:st.note,at:Date.now()};
    if(!SC.save(PK,p)){ p.pics=[]; p.npics=[]; SC.save(PK,p); }   // no room for the photos: keep the rest
  }
  function dropPickup(){ keptAt=""; SC.drop(PK); }
  // During a pickup the pop-up only closes with its × button or when the pickup is saved. On Android the back
  // action (which leaving the camera can trigger) closes pop-ups: block it, and if the phone closes it anyway,
  // open it again straight away with everything still in it, so the photo that is arriving lands in it.
  var pickOnPurpose=false;
  $("#dlg").addEventListener("click",function(e){ if(e.target.closest(".dlg-x")) pickOnPurpose=true; });
  $("#dlg").addEventListener("cancel",function(e){ if(keptAt) e.preventDefault(); });
  $("#dlg").addEventListener("close",function(){
    var d=this;
    if(keptAt&&!pickOnPurpose){ setTimeout(function(){ if(!d.open) d.showModal(); },0); return; }
    pickOnPurpose=false; dropPickup();
  });
  function resumePickup(){
    var p=SC.load(PK,null); if(!p) return;
    var j=findJob(p.code);
    if(!j||(j.status!=="Assigned"&&j.status!=="On the way")||Date.now()-(p.at||0)>3*3600*1000){ dropPickup(); return; }
    var st={pics:p.pics||[],npics:p.npics||[],noPhoto:!!p.noPhoto,vals:p.vals||{},method:p.method||"Cash",note:p.note||""};
    if(p.step==="weigh") stepWeigh(j,st); else if(p.step==="nothing") stepNothing(j,st); else stepPhoto(j,st);
    SC.toast("Your pickup "+j.code+" was kept. Carry on from here.");
  }
  function finish(sent,msgOnline){
    if(sent===false) return false;
    dropPickup();
    SC.closeDialog();
    if(sent!=="dropped") SC.toast(navigator.onLine===false?"Saved on this phone. It will be sent when you’re online.":msgOnline);
    setTab("today"); return true;
  }

  // Step 1: is the scrap actually there?
  function stepScrap(j,st){
    var body=stepBar(1)+'<p class="stepno">Step 1 of 3</p><h3>Is the scrap there?</h3>'+
      '<div class="iconrow big">'+itemIcons(j.types)+'</div>'+
      '<p class="detail">The customer listed: <b>'+esc(j.types)+'</b> — '+esc(j.qty)+'</p>'+
      '<div class="yesno"><button class="btn-no" id="s1No" type="button">'+ic("cross",48)+'<span>No</span><small>Nothing to collect</small></button>'+
      '<button class="btn-yes" id="s1Yes" type="button">'+ic("check",48)+'<span>Yes</span><small>The scrap is here</small></button></div>';
    SC.dialog("Pickup "+j.code,body,null);
    $("#s1Yes").addEventListener("click",function(){ buzz(true); stepPhoto(j,st); });
    $("#s1No").addEventListener("click",function(){ buzz(false); stepNothing(j,st); });
  }

  // Nothing to collect: choose why, add a photo if useful, tell the office
  function stepNothing(j,st){
    var body='<p class="stepno">Nothing to collect</p><h3>What happened?</h3>'+tileHtml(NOCOL,"nTiles")+
      '<select id="nWhy" hidden>'+NOCOL.map(function(r){ return '<option value="'+r[0]+'">'+esc(r[1])+'</option>'; }).join("")+'</select>'+
      '<div class="field"><label for="nNote">Details <span class="hint">Optional</span></label><textarea id="nNote"></textarea></div>'+
      '<div class="sec secic">'+ic("camera",22)+' Photo <span class="hint">Optional. A picture of the door or the place shows you were there.</span></div><div class="photos" id="nPhotos"></div>';
    SC.dialog("Pickup "+j.code,body,'<button class="fb back" id="nBack" type="button">'+ic("back",28)+'<span>Back</span></button><button class="fb no" id="nSend" type="button">'+ic("upload",28)+'<span>Tell the office</span></button>');
    bindTiles("nTiles","nWhy");
    st.npics=st.npics||[]; var npics=st.npics;
    mountPhotos($("#nPhotos"),npics,4,function(){ keepPickup(j,st,"nothing"); });
    keepPickup(j,st,"nothing");
    $("#nBack").addEventListener("click",function(){ stepScrap(j,st); });
    $("#nSend").addEventListener("click",function(){
      var why=$("#nWhy").value, note=$("#nNote").value, row=NOCOL.filter(function(r){return r[0]===why;})[0];
      check("Pickup "+j.code,"Tell the office that nothing was collected?",
        '<div class="cf-row"><span class="itemico bad">'+ic(row[2],32)+'</span><div class="cf-main"><b>'+esc(row[1])+'</b>'+(note.trim()?esc(note.trim()):"")+'</div></div>'+
        '<div class="cf-row"><span class="itemico">'+ic(npics.length?"camera":"nocamera",28)+'</span><div class="cf-main">'+(npics.length?npics.length+" photo"+(npics.length===1?"":"s")+" attached.":"No photo.")+'</div></div>',
        function(){ finish(enqueue({id:uid(),type:"nocollect",code:j.code,reason:why,note:note,photos:npics.slice(),label:row[1]}),"The office has been told."); },
        function(){ stepNothing(j,st); });
    });
  }

  // Step 2: photograph the scrap
  function stepPhoto(j,st){
    var body=stepBar(2)+'<p class="stepno">Step 2 of 3</p><h3>Take a photo of the scrap</h3>'+
      '<p class="detail">Show what you are collecting. It helps if there is a question later.</p><div class="photos" id="pPhotos"></div>'+
      '<label class="nophoto"><input type="checkbox" id="pNo"'+(st.noPhoto?" checked":"")+'>'+ic("nocamera",30)+'<span>I can’t take a photo right now</span></label>';
    SC.dialog("Pickup "+j.code,body,'<button class="fb back" id="pBack" type="button">'+ic("back",28)+'<span>Back</span></button><button class="fb go" id="pNext" type="button" disabled><span>Next: weigh</span>'+ic("next",28)+'</button>');
    function gate(){ $("#pNext").disabled=!(st.pics.length||st.noPhoto); keepPickup(j,st,"photo"); }
    mountPhotos($("#pPhotos"),st.pics,4,gate);
    $("#pNo").addEventListener("change",function(){ st.noPhoto=this.checked; gate(); });
    gate();
    $("#pBack").addEventListener("click",function(){ stepScrap(j,st); });
    $("#pNext").addEventListener("click",function(){ stepWeigh(j,st); });
  }

  // Step 3: weigh the items sold by weight, count the items sold by the piece, record how you paid
  function stepWeigh(j,st){
    var mine=(j.types||"").split(",").map(function(x){return x.trim();});
    var listedFirst=function(x,y){ return (mine.indexOf(y.name)>-1)-(mine.indexOf(x.name)>-1); };
    var weighed=S.rates.filter(function(r){ return r.unit!=="piece"; }).sort(listedFirst);
    var counted=S.rates.filter(function(r){ return r.unit==="piece"; }).sort(listedFirst);
    function row(r){
      var piece=r.unit==="piece", listed=mine.indexOf(r.name)>-1;
      return '<div class="wrow'+(listed?" mine":"")+'"><span class="itemico">'+itemIcon(r.name,30)+'</span>'+
        '<div class="wn">'+esc(r.name)+'<small>'+ic(piece?"count":"scale",14)+' '+SC.money(r.rate)+(piece?" per piece":" per kg")+(listed?" · customer listed this":"")+'</small></div>'+
        '<div class="wctl">'+(piece?'<button type="button" class="stepper" data-d="-1" aria-label="One less">'+ic("minus",24)+'</button>':"")+
        '<input type="number" inputmode="'+(piece?"numeric":"decimal")+'" min="0" step="'+(piece?"1":"0.01")+'" placeholder="'+(piece?"how many":"kg")+'" aria-label="'+(piece?"number of ":"kg of ")+esc(r.name)+'" data-t="'+esc(r.name)+'" data-r="'+r.rate+'" data-u="'+(piece?"piece":"kg")+'">'+
        (piece?'<button type="button" class="stepper" data-d="1" aria-label="One more">'+ic("plus",24)+'</button>':"")+'</div><div class="wamt">0.00</div></div>';
    }
    var body=stepBar(3)+'<p class="stepno">Step 3 of 3</p><h3>Weigh and count</h3>'+
      '<p class="detail">Prices come from the office rate list. '+(st.pics.length?st.pics.length+" photo"+(st.pics.length===1?"":"s")+" attached.":"No photo attached.")+'</p>'+
      (weighed.length?'<div class="sec secic">'+ic("scale",24)+' Weigh these <span class="hint">price per kg</span></div>'+weighed.map(row).join(""):"")+
      (counted.length?'<div class="sec secic">'+ic("count",24)+' Count these <span class="hint">price per piece, no weighing needed</span></div>'+counted.map(row).join(""):"")+
      '<div class="total"><span>Total</span><span><span id="tKg">0</span> kg · <span id="tPcs">0</span> pcs · <span id="tAmt">0.00</span></span></div>'+
      '<div class="sec secic">'+ic("cash",24)+' How did you pay the customer?</div>'+
      '<div class="radio">'+
      '<label class="paytile"><input type="radio" name="method" value="Cash"'+(st.method==="Cash"?" checked":"")+'><span>'+ic("cash",44)+'<b>Cash</b></span></label>'+
      '<label class="paytile"><input type="radio" name="method" value="Digital"'+(st.method==="Digital"?" checked":"")+'><span>'+ic("digital",44)+'<b>Digital</b></span></label></div>'+
      '<div class="field" style="margin-top:14px"><label for="jNote">Note <span class="hint">Optional</span></label><textarea id="jNote"></textarea></div>';
    SC.dialog("Pickup "+j.code,body,'<button class="fb back" id="wBack" type="button">'+ic("back",28)+'<span>Back</span></button><button class="fb yes" id="jSave" type="button" disabled>'+ic("check",30)+'<span>Save pickup</span></button>');
    function calc(){
      var kg=0,pcs=0,amt=0,items=[],lines=[];
      $$("#dlg input[data-t]").forEach(function(i){
        var piece=i.dataset.u==="piece", r=Number(i.dataset.r);
        var v=piece?Math.floor(Number(i.value)||0):SC.num(i.value), a=SC.num(v*r);
        i.closest(".wrow").querySelector(".wamt").textContent=SC.money(a);
        if(v>0){
          amt=SC.num(amt+a);
          if(piece){ pcs+=v; items.push({t:i.dataset.t,qty:v}); lines.push(i.dataset.t+" "+v+(v===1?" piece":" pieces")+" x "+SC.money(r)+" = "+SC.money(a)); }
          else { kg=SC.num(kg+v); items.push({t:i.dataset.t,kg:v}); lines.push(i.dataset.t+" "+v+" kg x "+SC.money(r)+" = "+SC.money(a)); }
        }
      });
      $("#tKg").textContent=kg; $("#tPcs").textContent=pcs; $("#tAmt").textContent=SC.money(amt);
      $("#jSave").disabled=!(items.length>0);
      return {kg:kg,pcs:pcs,amt:amt,items:items,lines:lines.join("\n")};
    }
    $$("#dlg input[data-t]").forEach(function(i){ i.addEventListener("input",calc); if(st.vals[i.dataset.t]!==undefined) i.value=st.vals[i.dataset.t]; });
    $("#jNote").value=st.note||"";
    $$("#dlg .stepper").forEach(function(b){ b.addEventListener("click",function(){
      var inp=b.closest(".wrow").querySelector("input"), v=Math.max(0,Math.floor(Number(inp.value)||0)+Number(b.dataset.d));
      inp.value=v?v:""; inp.dispatchEvent(new Event("input",{bubbles:true})); buzz(true);
    }); });
    calc();
    // remember the numbers and payment so far, in case the phone closes the page
    function snap(){ st.vals={}; $$("#dlg input[data-t]").forEach(function(i){ st.vals[i.dataset.t]=i.value; }); var m=$("#dlg input[name=method]:checked"); if(m) st.method=m.value; st.note=$("#jNote").value; keepPickup(j,st,"weigh"); }
    $$("#dlg input[data-t],#dlg input[name=method],#jNote").forEach(function(i){ i.addEventListener("change",snap); });
    $$("#dlg .stepper").forEach(function(b){ b.addEventListener("click",snap); });
    snap();
    $("#wBack").addEventListener("click",function(){ stepPhoto(j,st); });
    $("#jSave").addEventListener("click",function(){
      var c=calc(); if(!c.items.length) return;
      st.vals={}; $$("#dlg input[data-t]").forEach(function(i){ st.vals[i.dataset.t]=i.value; });
      st.method=$("#dlg input[name=method]:checked").value; st.note=$("#jNote").value;
      saveCheck(j,st,c);
    });
  }

  // The last look before saving: pictures, numbers and the total in big digits
  function saveCheck(j,st,c){
    var method=st.method;
    var rows=c.items.map(function(it){
      var r=rateOf(it.t)||{rate:0}, piece=it.qty!=null, amt=SC.num((piece?it.qty:it.kg)*r.rate);
      return '<div class="cf-row"><span class="itemico">'+itemIcon(it.t,30)+'</span><div class="cf-main"><b>'+esc(it.t)+'</b>'+ic(piece?"count":"scale",16)+' '+(piece?it.qty+(it.qty===1?" piece":" pieces"):it.kg+" kg")+'</div><div class="cf-amt">'+SC.money(amt)+'</div></div>';
    }).join("");
    var big=c.items.some(function(it){ return (it.kg||0)>=300||(it.qty||0)>=50; });
    var body=rows+
      '<div class="bignum">'+SC.money(c.amt)+'</div>'+
      '<p class="cf-line">'+esc(SC.qty(c.kg,c.pcs))+', total '+SC.money(c.amt)+', paid by '+esc(method.toLowerCase())+'.</p>'+
      '<div class="cf-row"><span class="itemico">'+ic(method==="Cash"?"cash":"digital",30)+'</span><div class="cf-main"><b>'+esc(method)+'</b></div></div>'+
      '<div class="cf-row"><span class="itemico">'+ic(st.pics.length?"camera":"nocamera",28)+'</span><div class="cf-main">'+(st.pics.length?st.pics.length+" photo"+(st.pics.length===1?"":"s")+" attached.":"No photo.")+'</div></div>'+
      (big?'<div class="cf-warn">'+ic("warning",30)+'<span>Very big number. Check it again.</span></div>':"");
    check("Pickup "+j.code,"Save this pickup?",body,
      function(){ finish(enqueue({id:uid(),type:"complete",code:j.code,items:c.items,method:method,note:st.note,photos:st.pics.slice(),est:{kg:c.kg,pcs:c.pcs,amt:c.amt,lines:c.lines}}),"Pickup saved."); },
      function(){ stepWeigh(j,st); });
  }

  /* ---------- go ---------- */
  SC.pwa("#installBtn");
  hydrate(document);
  if(token) start(); else showLogin("");
})();
</script>
</body>
</html>
